<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" font-family="-apple-system,'Segoe UI',Roboto,'Inter',sans-serif">
  <rect width="880" height="620" fill="#0d1117"/>
  <rect x="20" y="20" width="840" height="580" rx="14" fill="#0d1117" stroke="#30363d"/>
  <!-- header -->
  <rect y="20" width="840" height="52" rx="14" fill="#161b22"/>
  <text x="40" y="52" font-size="16" font-weight="700" fill="#e6edf3">Prompt•<tspan fill="#58a6ff">Skill</tspan>-Armory</text>
  <rect x="300" y="34" width="74" height="24" rx="12" fill="rgba(88,166,255,.1)" stroke="#30363d"/>
  <text x="320" y="50" font-size="12" font-weight="700" fill="#58a6ff">v0.7.0</text>
  <rect x="400" y="30" width="86" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="420" y="51" font-size="13" fill="#8b949e">⟳ 刷新</text>
  <!-- tabs -->
  <g font-size="13">
    <text x="40" y="100" fill="#e6edf3" font-weight="600">提示词 (3)</text><rect x="34" y="108" width="70" height="2" fill="#58a6ff"/>
    <text x="130" y="100" fill="#8b949e">技能 (1)</text>
    <text x="200" y="100" fill="#8b949e">MCP (0)</text>
    <text x="265" y="100" fill="#e6edf3" font-weight="600">Wallpaper</text><rect x="259" y="108" width="88" height="2" fill="#58a6ff"/>
    <text x="375" y="100" fill="#8b949e">Agent预设 (3)</text>
  </g>
  <!-- Wallpaper panel -->
  <rect x="20" y="124" width="840" height="470" rx="0" fill="#0d1117"/>
  <!-- title row -->
  <text x="40" y="156" font-size="14" font-weight="700" fill="#7ee787">桌面客户端 · 全局壁纸</text>
  <rect x="730" y="138" width="90" height="28" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="756" y="157" font-size="12" fill="#f85149">重置</text>
  <!-- enable switch -->
  <rect x="40" y="174" width="360" height="40" rx="8" fill="rgba(35,134,54,.22)" stroke="#238636"/>
  <text x="58" y="199" font-size="13" font-weight="600" fill="#7ee787">启用壁纸</text>
  <rect x="344" y="184" width="40" height="22" rx="11" fill="#3fb950"/>
  <circle cx="362" cy="195" r="9" fill="#ffffff"/>
  <!-- upload -->
  <rect x="40" y="228" width="360" height="56" rx="6" fill="#161b22" stroke-dasharray="4 3" stroke="#30363d"/>
  <text x="60" y="252" font-size="12" fill="#8b949e">🖼 上传本地壁纸（图片 / 视频）</text>
  <text x="60" y="270" font-size="11" fill="#484f58">bytes 存盘，settings 只存 id</text>
  <!-- url -->
  <rect x="420" y="228" width="400" height="34" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="436" y="250" font-size="12" fill="#484f58">图片 URL（https://…）</text>
  <!-- selected status -->
  <text x="420" y="290" font-size="12" fill="#58a6ff">已选择：🖼 图片（本地上传）</text>
  <rect x="600" y="274" width="60" height="26" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="622" y="292" font-size="11" fill="#f85149">清除</text>
  <!-- style section -->
  <text x="40" y="320" font-size="12" font-weight="700" fill="#e6edf3">样式</text>
  <line x1="100" y1="314" x2="820" y2="314" stroke="#30363d"/>
  <g font-size="12" fill="#8b949e">
    <text x="40" y="350">图片透明度 <tspan fill="#e6edf3">100%</tspan></text>
    <text x="40" y="382">遮罩 <tspan fill="#e6edf3">25%</tspan></text>
    <text x="40" y="414">玻璃模糊 <tspan fill="#e6edf3">16px</tspan></text>
  </g>
  <!-- gradient hint section -->
  <text x="450" y="340" font-size="12" font-weight="700" fill="#e6edf3">输入框下方提示样式</text>
  <rect x="450" y="356" width="30" height="22" rx="11" fill="#30363d"/>
  <circle cx="465" cy="367" r="9" fill="#ffffff"/>
  <text x="494" y="371" font-size="12" fill="#8b949e">启用 · 渐变色</text>
  <g font-size="12" font-weight="700">
    <text x="450" y="410" fill="#ec4899">极光</text>
    <text x="510" y="410" fill="#f97316">火焰</text>
    <text x="570" y="410" fill="#818cf8">晴空</text>
    <text x="630" y="410" fill="#a78bfa">霓虹</text>
    <text x="690" y="410" fill="#22d3ee">海洋</text>
    <text x="750" y="410" fill="#fb923c">晚霞</text>
  </g>
  <text x="450" y="452" font-size="11" fill="#8b949e">预览：<tspan fill="#22d3ee">12 轮 · 323 步 | LLM 55m41s · 缓存 98%</tspan></text>
</svg>
