<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-switchblade · edgelord panel preview</title>
<style>
  html, body {
    margin: 0; min-height: 100%;
    background: #04070a;
    color: #00ff9c;
    font-family: 'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;
  }
  body { padding: 40px; }
  .hint {
    font-size: 11px; color: #0f3d2c; letter-spacing: 2px;
    margin-bottom: 12px; text-transform: uppercase;
  }
  .hint b { color: #ff2b4b; }
</style>
</head>
<body>
  <div class="hint">> demo only · mock <b>SwitchbladeRemote</b> · click cards to toggle</div>
  <div id="mount"></div>

<script>
// ============================================================
// EDGELORD CRT PANEL — inlined port of src/client/panel.ts
// (dependency-free, Shadow-root). Mock remote below.
// ============================================================
const PHOSPHOR='#00ff9c', DAMNED='#ff2b4b', AMBER='#ffb000', GRAY='#0f3d2c';

const CSS=`
:host{all:initial}
*,*::before,*::after{box-sizing:border-box}
.swb-crt{background:#04070a;color:${PHOSPHOR};font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;padding:18px;border:1px solid ${GRAY};box-shadow:inset 0 0 40px rgba(0,255,156,.06),0 0 18px rgba(0,255,156,.15);position:relative;overflow:hidden;border-radius:2px}
.swb-crt::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;z-index:3}
.swb-crt::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,255,156,.07));z-index:2}
.swb-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid ${GRAY};padding-bottom:8px;margin-bottom:4px}
.swb-title{font-size:14px;font-weight:700;letter-spacing:2px;color:${PHOSPHOR};text-shadow:0 0 8px ${PHOSPHOR}}
.swb-title b{color:${DAMNED};text-shadow:0 0 8px ${DAMNED}}
.swb-stat{font-size:11px;color:${AMBER}}
.swb-boot{font-size:11px;color:#0f3d2c;white-space:pre;overflow:hidden;margin:4px 0 10px;animation:swb-blink 1.1s steps(2,start) infinite;min-height:1em}
@keyframes swb-blink{50%{opacity:.35}}
.swb-group{margin:10px 0 4px;font-size:11px;letter-spacing:3px;color:${AMBER};text-transform:uppercase}
.swb-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.swb-card{border:1px solid ${GRAY};background:rgba(0,40,24,.08);padding:10px 12px;position:relative;transition:border-color .12s,box-shadow .12s}
.swb-card:hover{border-color:${PHOSPHOR};box-shadow:0 0 10px rgba(0,255,156,.18)}
.swb-card.on{border-color:${PHOSPHOR};box-shadow:0 0 12px rgba(0,255,156,.3)}
.swb-card.off{border-color:${DAMNED};opacity:.75}
.swb-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.swb-name{font-size:13px;font-weight:700;color:${PHOSPHOR};word-break:break-all}
.swb-badge{font-size:9px;letter-spacing:1px;padding:2px 6px;border:1px solid currentColor;flex:none}
.swb-badge.enabled{color:${PHOSPHOR}} .swb-badge.disabled{color:${DAMNED}} .swb-badge.installed{color:${AMBER}}
.swb-id{font-size:10px;color:${GRAY};margin-top:2px}
.swb-desc{font-size:11px;color:#5fb08c;margin-top:4px;min-height:2.4em}
.swb-btn{margin-top:8px;width:100%;padding:6px 0;cursor:pointer;background:transparent;border:1px solid ${GRAY};color:${PHOSPHOR};font:inherit;font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:all .12s}
.swb-btn:hover:not(:disabled){border-color:${PHOSPHOR};background:rgba(0,255,156,.08);text-shadow:0 0 6px ${PHOSPHOR}}
.swb-btn:disabled{color:${GRAY};cursor:not-allowed}
.swb-empty{font-size:11px;color:${GRAY};padding:8px 0}
`;

function glyph(k){return k==='skill'?'▸':k==='profile'?'◆':'»'}

function mount(proxy, host){
  const root=host.attachShadow({mode:'open'});
  const style=document.createElement('style'); style.textContent=CSS;
  const shell=document.createElement('div'); shell.className='swb-crt';
  root.append(style,shell);
  const boot=document.createElement('div'); boot.className='swb-boot';
  const head=document.createElement('div'); head.className='swb-head';
  const title=document.createElement('div'); title.className='swb-title';
  title.innerHTML='DEEP<span><b>SWITCH</b></span>BLADE';
  const stat=document.createElement('div'); stat.className='swb-stat';
  head.append(title,stat); shell.append(boot,head);

  const groups={};
  function render(){
    Object.values(groups).forEach(e=>e.remove());
    Object.keys(groups).forEach(k=>delete groups[k]);
    proxy.catalog(undefined).then(raw=>{
      const cat=raw;
      const counts=cat.entries.reduce((a,e)=>{a[e.kind]=(a[e.kind]??0)+1;return a},{});
      stat.textContent=`skills:${counts.skill??0} · profiles:${counts.profile??0} · cmds:${counts.command??0}${cat.defaultProfile===undefined?'':` · default:${cat.defaultProfile}`}`;
      for(const kind of ['skill','profile','command']){
        const rows=cat.entries.filter(e=>e.kind===kind);
        const g=document.createElement('div'); g.className='swb-group'; g.textContent=`${glyph(kind)} ${kind}s`;
        groups[kind]=g; shell.append(g);
        if(rows.length===0){const emp=document.createElement('div');emp.className='swb-empty';emp.textContent=`(no ${kind}s loaded)`;shell.append(emp);continue}
        const grid=document.createElement('div'); grid.className='swb-rows';
        rows.forEach(e=>grid.append(card(proxy,boot,e)));
        shell.append(grid);
      }
      boot.textContent=`> catalog rendered · ${cat.entries.length} rows · ready`;
    }).catch(err=>{ boot.textContent=`> ERROR: ${String(err)}` });
  }
  function card(proxy,boot,entry){
    const el=document.createElement('div');
    el.className=`swb-card ${entry.state==='enabled'?'on':entry.state==='disabled'?'off':''}`;
    const top=document.createElement('div'); top.className='swb-card-top';
    const name=document.createElement('div'); name.className='swb-name';
    name.textContent=`${glyph(entry.kind)} ${entry.name}`;
    const badge=document.createElement('span'); badge.className=`swb-badge ${entry.state}`; badge.textContent=entry.state;
    top.append(name,badge);
    const id=document.createElement('div'); id.className='swb-id'; id.textContent=entry.id;
    const desc=document.createElement('div'); desc.className='swb-desc'; desc.textContent=entry.description;
    const btn=document.createElement('button'); btn.className='swb-btn';
    function repaint(){
      const on=entry.state==='enabled';
      btn.textContent=on?'DISABLE':'ENABLE';
      el.className=`swb-card ${on?'on':'off'}`;
      badge.textContent=entry.state;
    }
    btn.addEventListener('click',()=>{
      const on=entry.state==='enabled';
      btn.disabled=true; btn.textContent='…';
      const p=entry.kind==='skill'?proxy.setSkillEnabled(entry.name,!on):Promise.resolve({id:entry.id,state:on?'disabled':'enabled'});
      p.then(()=>{ entry.state=on?'disabled':'enabled'; btn.disabled=false; repaint(); boot.textContent=`> ${on?'disabled':'enabled'} ${entry.id}`; })
       .catch(()=>{ btn.disabled=false; });
    });
    repaint();
    el.append(top,id,desc,btn);
    return el;
  }
  render();
}

// ============================================================
// MOCK SwitchbladeRemote — pretend it's the Typert proxy.
// ============================================================
const catalog={
  defaultProfile:'graybeard',
  entries:[
    {kind:'skill', id:'skill:code-review',  name:'code-review',  description:'Review staged diffs before merge; flag risky mutations and missing tests.',     state:'enabled'},
    {kind:'skill', id:'skill:red-team',     name:'red-team',     description:'Attack-surface sweep: enumerate auth gaps, default creds, and unsafe deserialization.', state:'disabled'},
    {kind:'skill', id:'skill:refactor',     name:'refactor',     description:'Split long functions, name magic numbers, and keep the diff surgical.',             state:'enabled'},
    {kind:'skill', id:'skill:oathbreaker',  name:'oathbreaker',  description:'Deobfuscate packed payloads, walk unpackers, and recover the original control flow.', state:'disabled'},
    {kind:'profile', id:'profile:graybeard', name:'graybeard', description:'Senior systems prompt: terse, low-trust, verifies before adapting.',                  state:'installed'},
    {kind:'profile', id:'profile:windowlicker', name:'windowlicker', description:'Frontend/design persona: shiny first, semantics after.',                          state:'installed'},
    {kind:'command', id:'command:sw',       name:'sw',           description:'Switchblade: list installed skills, profiles, and slash commands.',                 state:'installed'},
    {kind:'command', id:'command:sw-profile', name:'sw-profile', description:'Switchblade: show or set the default prompt profile.',                            state:'installed'},
  ]
};
const mock={
  catalog: async()=>catalog,
  setSkillEnabled: async(name,enabled)=>{
    const e=catalog.entries.find(x=>x.kind==='skill'&&x.name===name);
    if(e) e.state=enabled?'enabled':'disabled';
    return {id:`skill:${name}`, state:e?e.state:'disabled'};
  }
};

mount(mock, document.getElementById('mount'));
</script>
</body>
</html>
